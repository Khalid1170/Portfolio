<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khalid | Portfolio</title>

    <!-- Prevent white flash and theme flicker before React loads -->
    <style>
      html { background-color: #080d1a; }
    </style>
    <script>
      const theme = localStorage.getItem("theme");
      if (theme === "light") {
        document.documentElement.style.backgroundColor = "#f1f5fb";
      } else {
        document.documentElement.classList.add("dark");
      }
    </script>

    <!-- Font preconnect (cuts Google Fonts latency) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- DNS prefetch for Vercel deploys -->
    <link rel="dns-prefetch" href="https://vercel.app" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
